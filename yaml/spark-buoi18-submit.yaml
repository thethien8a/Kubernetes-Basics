apiVersion: batch/v1
kind: Job
metadata:
  name: spark-submit-buoi18
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: spark-submit-buoi18
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: submit
          image: docker.io/library/spark:4.1.3-python3
          imagePullPolicy: IfNotPresent
          args:
            - /opt/spark/bin/spark-submit
            - --master
            - spark://spark-master-svc:7077
            - --deploy-mode
            - client
            - --driver-memory
            - 512m
            - --executor-memory
            - 512m
            - --executor-cores
            - "1"
            - --total-executor-cores
            - "2"
            - /opt/spark/app/spark-buoi18.py
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: application
              mountPath: /opt/spark/app
              readOnly: true
      volumes:
        - name: application
          configMap:
            name: spark-buoi18-code
