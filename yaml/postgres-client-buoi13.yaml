apiVersion: v1
kind: Pod
metadata:
  name: postgres-client-buoi13
  namespace: default
  labels:
    app: postgres-client-buoi13
spec:
  containers:
    - name: client
      image: postgres:16-alpine
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          # libpq bỏ qua password file nếu group hoặc others đọc được.
          umask 077
          username=$(sed 's/\\/\\\\/g; s/:/\\:/g' /run/secrets/postgres/username)
          password=$(sed 's/\\/\\\\/g; s/:/\\:/g' /run/secrets/postgres/password)
          printf '%s:%s:%s:%s:%s\n' "$PGHOST" "$PGPORT" "$PGDATABASE" "$username" "$password" > "$PGPASSFILE"
          unset username password
          while true; do sleep 3600; done
      env:
        - name: PGHOST
          value: postgres-buoi13
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: labdb
        - name: PGPASSFILE
          value: /tmp/pgpass
        - name: PGCONNECT_TIMEOUT
          value: "5"
      volumeMounts:
        - name: credentials
          mountPath: /run/secrets/postgres
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: credentials
      secret:
        secretName: postgres-secret-buoi13
        items:
          - key: username
            path: username
          - key: password
            path: password