apiVersion: v1
kind: Service
metadata:
  name: storage-buoi14-headless
  namespace: default
spec:
  # Bài chỉ cần DNS member, không có server ứng dụng để expose cổng.
  clusterIP: None
  selector:
    app: storage-buoi14
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-buoi14
  namespace: default
spec:
  serviceName: storage-buoi14-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: storage-buoi14
  template:
    metadata:
      labels:
        app: storage-buoi14
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          # Không tự ghi dữ liệu để tránh tái tạo dấu test khi Pod bị thay.
          args: ["while true; do sleep 3600; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: storage-buoi14
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
