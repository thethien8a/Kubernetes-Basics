apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: master
          image: docker.io/library/spark:4.1.3-python3
          args:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - --host
            - $(POD_IP)
            - --port
            - "7077"
            - --webui-port
            - "8080"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_DAEMON_MEMORY
              value: "256m"
          ports:
            - name: rpc
              containerPort: 7077
            - name: web-ui
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-svc
spec:
  type: ClusterIP
  selector:
    app: spark-master
  ports:
    - name: rpc
      port: 7077
      targetPort: rpc
    - name: web-ui
      port: 8080
      targetPort: web-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/spark:4.1.3-python3
          args:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master-svc:7077
            - --host
            - $(POD_IP)
            - --port
            - "7078"
            - --webui-port
            - "8081"
            - --cores
            - "1"
            - --memory
            - 512M
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_DAEMON_MEMORY
              value: "256m"
            - name: SPARK_WORKER_OPTS
              value: "-Dspark.worker.preferConfiguredMasterAddress=true"
          ports:
            - name: rpc
              containerPort: 7078
            - name: web-ui
              containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 5
            failureThreshold: 12
