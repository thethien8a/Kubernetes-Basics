apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-buoi8
  namespace: default
  labels:
    app: app-buoi8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-buoi8
  template:
    metadata:
      labels:
        app: app-buoi8
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                printf 'ENV: DB_HOST=%s DB_PORT=%s LOG_LEVEL=%s\n' \
                  "$DB_HOST" "$DB_PORT" "$LOG_LEVEL"
                printf 'FILE: LOG_LEVEL=%s\n' "$(cat /etc/app-config/LOG_LEVEL)"
                sleep 30
              done
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config-buoi8
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config-buoi8
                  key: DB_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config-buoi8
                  key: LOG_LEVEL
          volumeMounts:
            - name: app-config
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: app-config-buoi8