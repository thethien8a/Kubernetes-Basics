apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-buoi6
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: nginx.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-buoi4
                port:
                  number: 8080