apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-buoi9
  namespace: default
  labels:
    app: app-buoi9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-buoi9
  template:
    metadata:
      labels:
        app: app-buoi9
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                # Only print presence markers so credentials do not leak into logs.
                printf 'POSTGRES_USER=%s POSTGRES_PASSWORD=%s MINIO_ACCESS_KEY=%s MINIO_SECRET_KEY=%s\n' \
                  "${POSTGRES_USER:+present}" "${POSTGRES_PASSWORD:+present}" \
                  "${MINIO_ACCESS_KEY:+present}" "${MINIO_SECRET_KEY:+present}"
                sleep 30
              done
          envFrom:
            - secretRef:
                name: app-secret-buoi9
