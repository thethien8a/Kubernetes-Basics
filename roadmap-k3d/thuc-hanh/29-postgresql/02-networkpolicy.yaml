apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pg-client-only
  namespace: lesson29-pg
  labels:
    environment: lab
    lesson: "29"
    app: lesson29-pg
spec:
  podSelector:
    matchLabels:
      app: lesson29-pg
      role: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lesson29-pg
              role: client
      ports:
        - protocol: TCP
          port: 5432
