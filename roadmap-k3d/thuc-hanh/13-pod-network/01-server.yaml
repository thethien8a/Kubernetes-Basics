apiVersion: v1
kind: Pod
metadata:
  name: pod-net-server
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "13"
    app: pod-net
    role: server
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostNetwork: false
  nodeSelector:
    kubernetes.io/hostname: k3d-de-k3d-agent-0
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  containers:
    - name: http
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          mkdir -p /www
          printf '%s\n' 'lesson13-cross-node-ok' > /www/index.html
          exec httpd -f -p 0.0.0.0:8080 -h /www
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
