apiVersion: v1
kind: Pod
metadata:
  name: pod-net-client
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "13"
    app: pod-net
    role: client
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostNetwork: false
  nodeSelector:
    kubernetes.io/hostname: k3d-de-k3d-agent-1
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
