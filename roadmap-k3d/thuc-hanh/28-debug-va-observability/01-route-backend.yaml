apiVersion: v1
kind: Pod
metadata:
  name: lesson28-route-backend
  namespace: lesson28-debug
  labels:
    environment: lab
    lesson: "28"
    app: lesson28-route
    role: backend
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          site=$(mktemp -d /tmp/lesson28.XXXXXX)
          printf '%s\n' 'lesson28-route-ok' > "$site/index.html"
          exec httpd -f -p 0.0.0.0:8080 -h "$site"
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 2
        timeoutSeconds: 1
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
