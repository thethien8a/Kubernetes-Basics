apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lesson15-gateway-route
  # HTTPRoute nam tai namespace de-lab cua Data Engineer
  namespace: de-lab
spec:
  # Tham chieu cross-namespace den Gateway k3d-gateway tai kube-system
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: k3d-gateway
    namespace: kube-system
  # Ten mien thu nghiem danh rieng cho route nay
  hostnames:
  - gateway-demo.test
  rules:
  # Dinh tuyen tat ca request bat dau bang / vao Service backend cua bai 14/15
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: service-dns-svc
      port: 80
      weight: 1
