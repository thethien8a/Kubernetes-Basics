apiVersion: batch/v1
kind: CronJob
metadata:
  name: forbid-demo
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "07"
    app: forbid-demo
spec:
  schedule: "* * * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  suspend: true
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        lesson: "07"
        app: forbid-demo
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            lesson: "07"
            app: forbid-demo
        spec:
          restartPolicy: Never
          containers:
            - name: slow-task
              image: busybox:1.37.0
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  printf 'task started\n'
                  sleep 90
                  printf 'task completed\n'
