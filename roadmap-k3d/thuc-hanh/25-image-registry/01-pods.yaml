apiVersion: v1
kind: Pod
metadata:
  name: lesson25-worker-a
  namespace: de-lab
  labels:
    lesson: "25"
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k3d-de-k3d-agent-0
  restartPolicy: Never
  containers:
    - name: worker
      image: docker.io/library/lesson25-etl-worker:local-v1
      imagePullPolicy: Never
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
