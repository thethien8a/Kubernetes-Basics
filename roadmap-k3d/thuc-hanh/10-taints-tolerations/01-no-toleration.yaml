apiVersion: v1
kind: Pod
metadata:
  name: taint-gate-lab
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "10"
    app: taint-gate-lab
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-de-k3d-agent-0
  restartPolicy: Always
  containers:
    - name: worker
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
