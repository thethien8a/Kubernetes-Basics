apiVersion: v1
kind: Namespace
metadata:
  name: lesson26-test
  labels:
    team: data
    environment: lab
    lesson: "26"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lesson26-container-memory
  namespace: lesson26-test
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
      default:
        memory: 128Mi
      min:
        memory: 32Mi
      max:
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lesson26-memory
  namespace: lesson26-test
spec:
  hard:
    requests.memory: 96Mi
