apiVersion: v1
kind: Pod
metadata:
  name: lesson26-baseline
  namespace: lesson26-test
  labels:
    team: data
    environment: lab
    lesson: "26"
    app: lesson26-baseline
spec:
  automountServiceAccountToken: false
  containers:
    - name: worker
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 25m
        limits:
          cpu: 100m
