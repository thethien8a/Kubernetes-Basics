apiVersion: v1
kind: Pod
metadata:
  name: netpol-server
  namespace: lesson17-netpol
  labels:
    team: data
    environment: lab
    lesson: "17"
    app: server
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  hostNetwork: false
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  nodeSelector:
    kubernetes.io/hostname: k3d-de-k3d-agent-0
  containers:
    - name: http
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          mkdir -p /www
          printf '%s\n' 'lesson17-netpol-ok' > /www/index.html
          printf '%s\n' 'ready' > /www/ready
          exec httpd -f -p 0.0.0.0:8080 -h /www
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /ready
          port: http
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 1
        successThreshold: 1
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
