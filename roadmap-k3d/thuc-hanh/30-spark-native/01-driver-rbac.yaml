apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: lesson30-spark
  labels:
    lesson: "30"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-executor
  namespace: lesson30-spark
  labels:
    lesson: "30"
# The Executor only needs to talk to Spark processes, so it does not need an API token.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: lesson30-spark
  labels:
    lesson: "30"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "deletecollection"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: lesson30-spark
  labels:
    lesson: "30"
subjects:
  - kind: ServiceAccount
    name: spark-driver
    namespace: lesson30-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
