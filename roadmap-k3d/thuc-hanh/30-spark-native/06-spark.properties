spark.kubernetes.context k3d-de-k3d
spark.kubernetes.namespace lesson30-spark
spark.kubernetes.driver.pod.name lesson30-demo-01-driver
spark.kubernetes.driver.label.lesson30-run demo-01
spark.kubernetes.executor.label.lesson30-run demo-01
spark.kubernetes.container.image docker.io/library/spark:4.0.2-python3@sha256:cf4427b1cb3f562774aadfc99d1379ec0bd8fed97130ff4d33207ea8830d4ec7
1
spark.kubernetes.authenticate.driver.serviceAccountName spark-driver
spark.kubernetes.authenticate.executor.serviceAccountName spark-executor
spark.kubernetes.driver.ownPersistentVolumeClaim false

spark.dynamicAllocation.enabled false
spark.executor.instances 2
spark.executor.cores 1
spark.task.cpus 1
spark.driver.memory 512m
spark.driver.memoryOverhead 384m
spark.executor.memory 512m
spark.executor.memoryOverhead 384m
spark.kubernetes.driver.request.cores 250m
spark.kubernetes.driver.limit.cores 1
spark.kubernetes.executor.request.cores 250m
spark.kubernetes.executor.limit.cores 1

# Leave time for the first image pull but bound the barrier's slot checks.
spark.scheduler.barrier.maxConcurrentTasksCheck.interval 5s
spark.scheduler.barrier.maxConcurrentTasksCheck.maxFailures 48
spark.kubernetes.submission.waitAppCompletion false
# Keep Executor Pod specs available for the placement and image review.
spark.kubernetes.executor.deleteOnTermination false
