apiVersion: v1
kind: Pod
metadata:
  name: resources-fit-lab
  namespace: de-lab
  labels:
    lesson: "08"
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: busybox:1.37.0
      command: ["sleep", "86400"]
      # Chỉ xét scheduling; sleep không tạo tải RAM lớn.
      resources:
        requests:
          cpu: 25m
          memory: 16Gi
        limits:
          cpu: 100m
          memory: 16Gi
