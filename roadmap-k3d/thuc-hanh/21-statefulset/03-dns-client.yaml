apiVersion: v1
kind: Pod
metadata:
  name: marker-dns-client
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "21"
    app: marker-dns-client
spec:
  automountServiceAccountToken: false
  dnsPolicy: ClusterFirst
  restartPolicy: Never
  containers:
    - name: dns
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
