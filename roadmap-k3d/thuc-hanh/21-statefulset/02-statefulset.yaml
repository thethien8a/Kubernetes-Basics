apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: marker
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "21"
    app: marker
spec:
  serviceName: marker-peers
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  selector:
    matchLabels:
      app: marker
      lesson: "21"
  template:
    metadata:
      labels:
        team: data
        environment: lab
        lesson: "21"
        app: marker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/hostname: k3d-de-k3d-agent-0
      containers:
        - name: worker
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          imagePullPolicy: IfNotPresent
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 128Mi
