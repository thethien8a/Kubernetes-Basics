apiVersion: v1
kind: Pod
metadata:
  name: lesson23-config-reader
  namespace: de-lab
  labels:
    lesson: "23"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-eu", "-c"]
      args:
        - |
          previous=
          while true; do
            file_value=$(cat /etc/etl/batch-size.txt)
            if [ "$file_value" != "$previous" ]; then
              printf 'env=%s file=%s\n' "$BATCH_SIZE" "$file_value"
              previous="$file_value"
            fi
            sleep 5
          done
      env:
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: lesson23-etl-settings
              key: batch-size
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: settings
          mountPath: /etc/etl
          readOnly: true
  volumes:
    - name: settings
      configMap:
        name: lesson23-etl-settings
        items:
          - key: batch-size
            path: batch-size.txt
