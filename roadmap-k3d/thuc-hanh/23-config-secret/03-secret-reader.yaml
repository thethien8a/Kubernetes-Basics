apiVersion: v1
kind: Pod
metadata:
  name: lesson23-secret-reader
  namespace: de-lab
  labels:
    lesson: "23"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          if [ -n "${DB_PASSWORD:-}" ]; then
            printf 'credential_loaded=true\n'
          else
            printf 'credential_loaded=false\n'
            exit 1
          fi
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lesson23-etl-db
              key: password
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
