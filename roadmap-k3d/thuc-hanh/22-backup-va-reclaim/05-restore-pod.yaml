apiVersion: v1
kind: Pod
metadata:
  name: lesson22-restore
  namespace: de-lab
  labels:
    team: data
    environment: lab
    lesson: "22"
    app: backup-restore
    role: restore
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: restore
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: data
          mountPath: /restore
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lesson22-restored
