apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-lab
  namespace: de-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rollout-lab
  template:
    metadata:
      labels:
        app: rollout-lab
        version: "v2"
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "echo 'PreStop hook: flushing buffers...' && sleep 5"]
          readinessProbe:
            httpGet:
              path: /broken-healthz
              port: 80
            periodSeconds: 2
            failureThreshold: 2
