apiVersion: v1
kind: Pod
metadata:
  name: app-buoi11
  namespace: default
  labels:
    app: app-buoi11
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"
